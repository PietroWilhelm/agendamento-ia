vaadin.launch-browser=true
spring.application.name=AgendamentoComIA

# Chat via Groq (API compatível com OpenAI) - chave na variável de ambiente OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# Embeddings locais (ONNX, all-MiniLM-L6-v2, 384 dimensões) - a Groq não tem embeddings
spring.ai.model.embedding=transformers

# Vector database (pgvector) - dimensão do modelo local
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update